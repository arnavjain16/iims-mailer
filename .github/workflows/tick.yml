name: tick

# One run loops every minute for ~5 h 40 min (see scripts/runner/tick.py) and starts its successor.
# The cron is only a backup: GitHub throttles scheduled runs.
on:
  workflow_dispatch:
    inputs:
      dry_run_to:
        description: "Test mode: send the first approved emails to THIS address only (nothing marked sent)"
        required: false
        default: ""
      dry_run_limit:
        description: "Test mode: how many emails to send to the test address"
        required: false
        default: "2"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # test runs (dry_run_to set) get their own group so they never wait behind the long sender run
  group: ${{ inputs.dry_run_to != '' && 'dry-run' || 'sender' }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_APP_TOKEN: ${{ secrets.SENDER_APP_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      GH_TOKEN: ${{ github.token }}
      # Kill switch: data/control.json ("sending_enabled": true/false), re-read every minute.
      DRY_RUN_TO: ${{ inputs.dry_run_to }}
      DRY_RUN_LIMIT: ${{ inputs.dry_run_limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Git identity for bot commits
        run: |
          git config user.name "mailer-bot"
          git config user.email "mailer-bot@users.noreply.github.com"
      - name: Check secrets exist (values are never printed)
        run: |
          for v in SENDER_EMAIL SENDER_APP_TOKEN SMTP_USER; do
            if [ -z "${!v}" ]; then echo "Secret $v is missing."; exit 1; fi
          done
      - name: Run the sender loop
        id: loop
        run: python scripts/runner/tick.py
      - name: Restart after a crash
        if: failure() && steps.loop.outcome == 'failure' && inputs.dry_run_to == ''
        run: |
          sleep 120
          gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY"
